# regolith-multisession configuration (bash). A per-user copy in
# ~/.config/regolith3/multisession/multisession.conf is read after this one;
# only the per-session settings (ISOLATE, BRIDGE_NAMES, LATE_AUTOSTART_DELAY)
# make sense there.
#
# A session has a multi-session entry in the greeter when
# /usr/share/xsessions/<session>-multisession.desktop exists. This package
# ships the one for regolith-x11. For another session, e.g. i3:
#   regolith-multisession entry i3 | sudo tee /usr/share/xsessions/i3-multisession.desktop
# and, to start its components itself, a profile in profiles/<session>.conf.

# When a login runs standalone (own bus, no user manager):
#   auto    when the user already has a graphical session (the default)
#   always  every login, the first one too
#   never   never: the stock session, which refuses a second login
ISOLATE=auto

# Appended to the session's name by 'regolith-multisession entry'
NAME_SUFFIX=" (multi-session)"

# Per-user services that standalone sessions use from the user bus instead of
# starting their own instance. Add a name here when a service keeps per-user
# state that two instances would fight over.
BRIDGE_NAMES=(
    ca.desrt.dconf                                # settings: two writers lose each other's changes
    org.freedesktop.secrets                       # gnome-keyring
    org.freedesktop.impl.portal.PermissionStore   # portal permissions
    org.freedesktop.portal.Documents              # owns the FUSE mount at $XDG_RUNTIME_DIR/doc
)

# XDG autostart entries (desktop file names without .desktop) that standalone
# sessions don't start: per-user daemons that already run for the user's first
# session, where a second instance would duplicate work or fight over files.
AUTOSTART_SKIP=(
    localsearch-3                     # file indexer: one per user database
    org.gnome.Evolution-alarm-notify  # calendar reminders would show twice
)

# Programs that run once per display, not once per user. Inside standalone
# sessions, pgrep/pkill/pidof only see the instance on the session's own
# display, so restarting a compositor in one session leaves the others alone.
DISPLAY_SCOPED_PROCESSES=(picom compton xcompmgr)

# Seconds between starting the window manager and the autostart entries of
# the later phases (applets need the bar to be up)
LATE_AUTOSTART_DELAY=1
