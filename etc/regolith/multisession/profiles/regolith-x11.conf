# How a standalone Regolith X11 session starts (bash).
#
# The stock session runs gnome-session, which starts the components of
# regolith-x11.session through the systemd user manager. gnome-session 50
# refuses to start while the user has another graphical session, and has no
# --builtin mode any more, so a standalone session starts the same pieces
# itself.

# /usr/share/gnome-session/sessions/<GNOME_SESSION>.session: its
# RequiredComponents (gsd plugins, gnome-flashback) start before the window
# manager
GNOME_SESSION=regolith-x11

# The component that is the window manager: it runs in the foreground, and
# the session ends with it (regolith-x11.desktop → regolith-session-x11).
# Set WM_EXEC instead to give the command directly.
WM_COMPONENT=regolith-x11

# Components not to start
COMPONENTS_SKIP=()

# Session-scoped XDG configuration, as regolith-session-x11-launch sets it
XDG_CONFIG_PREFIX=/etc/xdg/xdg-regolith-x11

# Run XDG autostart entries (OnlyShowIn/NotShowIn, Hidden, TryExec,
# AutostartCondition and phases are honoured)
AUTOSTART=true

# Runs in the standalone session before anything starts
standalone_setup() {
    export GNOME_DESKTOP_SESSION_ID=this-is-deprecated   # as gnome-session sets it
}
